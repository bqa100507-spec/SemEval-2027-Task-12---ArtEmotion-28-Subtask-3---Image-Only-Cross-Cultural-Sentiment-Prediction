name: ST3 tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Notebook tests verify the immutable helper's historical Git object.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install $(sed -nE '/^(numpy|pandas|Pillow|pytest|scikit-learn|scipy|threadpoolctl|joblib)==/p' requirements.txt)
      - name: Install pinned CPU Torch for caption student tests
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
      - name: Install pinned Transformers for tiny visual LoRA tests
        run: python -m pip install transformers==4.49.0
      - name: Validate notebook schemas
        run: |
          python -m pip install nbformat==5.10.4
          python -c "import nbformat; from pathlib import Path; [nbformat.validate(nbformat.read(p, as_version=4)) for p in Path('notebooks').glob('EXP022_*.ipynb')]"
      - run: python -m pytest -q
