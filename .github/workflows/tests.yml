name: ST3 tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install $(sed -nE '/^(numpy|pandas|Pillow|pytest|scikit-learn|scipy|threadpoolctl|joblib)==/p' requirements.txt)
      - name: Install pinned CPU Torch for tiny student and workflow tests
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
      - name: Validate notebook schemas
        run: |
          python -m pip install nbformat==5.10.4
          python -c "import nbformat; from pathlib import Path; [nbformat.validate(nbformat.read(p, as_version=4)) for pattern in ('EXP023*.ipynb', 'EXP026*.ipynb', 'EXP027*.ipynb', 'TASK031*.ipynb') for p in Path('notebooks').glob(pattern)]"
      - run: python -m pytest -q
