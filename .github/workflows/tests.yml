name: ST3 tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install $(sed -nE '/^(numpy|pandas|Pillow|pytest|scikit-learn|scipy|threadpoolctl|joblib)==/p' requirements.txt)
      - run: python -m pytest -q
